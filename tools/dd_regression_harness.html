<!DOCTYPE html>
<!-- dd_regression_harness.html —— 下拉控件回归测试夹具：仿两页缩放结构（无游戏依赖）
     A 面板：祖先 zoom 0.845（仿调度机队）；B 面板：祖先 zoom 0.62（仿交易页 #app）。
     规则按面板作用域隔离（.pa/.pb 前缀）——同一文档两套表互不覆盖（游戏内两页是独立 iframe 无此问题）。
     结构照抄实际注入形态：flex 工具栏行 [外来按钮][我们包裹器[按钮(+弹层)]]，上有 overflow:hidden 祖先。 -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #222; }
  .stage { display: flex; gap: 40px; padding: 20px; }
  #appA { zoom: 0.845; }
  #appB { zoom: 0.62; }
  .pane { width: 620px; height: 500px; background: #333; display: flex; flex-direction: column; justify-content: flex-end; }
  .toolbar { display: flex; align-items: center; gap: 8px; padding: 8px; }
  .foreign { font-size: 12px; padding: 4px 10px; border: 1px solid rgba(255,255,255,.15); border-radius: 4px; background: rgba(255,255,255,.06); color: #fff; cursor: pointer; }
  .cliphost { overflow: hidden; flex: 1; } /* 仿 #trade 的 overflow:hidden 祖先 */
</style>
</head>
<body>
<div class="stage">
  <div id="appA" class="pa"><div class="pane">
    <div class="cliphost"></div>
    <div class="toolbar" id="rowA">
      <button class="foreign">一键整理</button>
      <div class="sltf-dd-wrap" id="wrapA"><button class="sltf-dd-btn" id="btnA">全部柜子 ▾</button></div>
    </div>
  </div></div>
  <div id="appB" class="pb"><div class="pane">
    <div class="cliphost"></div>
    <div class="toolbar" id="rowB">
      <button class="foreign">排序 ▾</button>
      <div class="sltf-dd-wrap" id="wrapB"><button class="sltf-dd-btn" id="btnB">全部柜子 ▾</button></div>
    </div>
  </div></div>
</div>
<script>
// 与 tagfilter.page.js 的 ensureDDStyle 同构（DD_VIS=0.647 + 静态表 k + 显式高 28.13）——保持两处同步是测试有效的前提
function sheet(scope, k) {
  var P = '.' + scope + ' ';
  var VIS = 0.647;
  var px = function (c) { return (c * VIS / k).toFixed(2) + 'px'; };
  return P + '.sltf-dd-btn{font-family:inherit;font-size:' + px(12) + ';line-height:1.5;color:#fff;white-space:nowrap;'
    + 'background:rgba(255,255,255,0.06);border:' + px(1) + ' solid rgba(255,255,255,0.15);border-radius:' + px(4) + ';'
    + 'padding:' + px(4) + ' ' + px(10) + ';text-align:left;cursor:pointer;display:flex;align-items:center;gap:' + px(6) + ';'
    + 'box-sizing:border-box;height:' + px(28.13) + ';}'
    + P + '.sltf-dd-btn:hover{border-color:rgba(251,176,52,0.6);}'
    + P + '.sltf-dd-btn.on{color:#fbb034;border-color:rgba(251,176,52,0.75);background:rgba(251,176,52,0.14);}'
    + P + '.sltf-dd-opt{font-family:inherit;font-size:' + px(12) + ';line-height:1.5;color:#fff;white-space:nowrap;'
    + 'background:rgba(255,255,255,0.06);border:' + px(1) + ' solid rgba(255,255,255,0.15);border-radius:' + px(4) + ';'
    + 'padding:' + px(4) + ' ' + px(10) + ';text-align:left;cursor:pointer;box-sizing:border-box;height:' + px(28.13) + ';}'
    + P + '.sltf-dd-opt:hover{border-color:rgba(251,176,52,0.6);}'
    + P + '.sltf-dd-opt.on{color:#fbb034;}'
    + P + '.sltf-dd-pop{display:flex;flex-direction:column;gap:' + px(2) + ';padding:' + px(3) + ';border-radius:' + px(4) + ';'
    + 'background:#1d1e22;border:' + px(1) + ' solid rgba(255,255,255,0.15);}';
}
function apply(id, scope, k) {
  var sid = 'sheet-' + scope;
  var old = document.getElementById(sid); if (old) old.remove();
  var s = document.createElement('style'); s.id = sid; s.textContent = sheet(scope, k); document.head.appendChild(s);
  document.getElementById(id).style.cssText = 'position:relative;display:inline-flex;max-width:130px;'; // placeDD 行内分支终态（必须 relative：弹层锚点）
}
apply('wrapA', 'pa', 0.845);
apply('wrapB', 'pb', 0.62);
// 开弹层（与 togglePop 同构：纯 CSS 锚定 bottom:calc(100%+6px) + 右缘溢出翻转）
function openPop(id) {
  var wrap = document.getElementById(id);
  var old = wrap.querySelector('.sltf-dd-pop'); if (old) old.remove();
  var pop = document.createElement('div');
  pop.className = 'sltf-dd-pop';
  for (var i = 0; i < 12; i++) { var b = document.createElement('button'); b.className = 'sltf-dd-opt'; b.textContent = '选项' + i; pop.appendChild(b); }
  pop.style.cssText = 'position:absolute;z-index:99999;left:0;bottom:calc(100% + 6px);max-height:190px;overflow-y:auto;';
  wrap.appendChild(pop);
  return pop;
}
window.__open = openPop;
</script>
</body>
</html>
