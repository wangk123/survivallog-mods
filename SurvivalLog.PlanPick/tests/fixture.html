<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>PlanPick 回归夹具（官方 RogueSelect 骨架最小复刻）</title>
<!-- official.css = 官方页 CSS 变量/页脚/按钮复刻（serve 端映射到 prototype/official.css，
     只读使用；RogueSelect 页自带这些变量，page.js 不重复定义） -->
<link rel="stylesheet" href="official.css">
</head>
<body>
<!-- 官方 RogueSelect 页面骨架最小复刻：无候选三卡（夹具不模拟官方区内容，只验证注入 UI 零接触官方区） -->
<div id="app">
  <div class="scene-overlay"></div>
  <div class="panel" style="margin-top:26px">
    <div class="content">
      <div class="title-wrap"><h1 class="title">生 存 规 划</h1></div>
      <div class="divider"></div>
      <div class="card-grid few" id="officialGrid"></div>
      <div class="footer">
        <div class="footer-left">拥有生存点：<span class="own-num" id="ownPoints">0</span></div>
        <div class="footer-center">
          <div class="refresh-group">
            <button class="ghost-btn refresh-btn">刷 新</button>
            <span class="refresh-cost">生存点：15</span>
          </div>
        </div>
        <div class="footer-right">
          <!-- page.js 应把入口按钮插到这里首位（"离开"之前） -->
          <button class="primary-btn">离 开</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="page.js"></script>
<script>
'use strict';
// 收集 page.js 的上行消息：window.parent.postMessage —— 夹具无父窗（window.parent === window），
// 自发自收，安全；断言在此读取。
window.__ppMessages = [];
window.addEventListener('message', function (e) {
  if (e && e.data && e.data.type === 'CLICK_BUY') window.__ppMessages.push(e.data);
});
// 换数据重推：服务端按 query（day/role/points/mult）重算 state/reasons 返回新 golden，
// 再走同一条 __PlanPickBoot 通道（模拟 C# 下一轮推送）。
window.__fixtureSet = function (patch) {
  var q = Object.keys(patch || {}).map(function (k) { return k + '=' + encodeURIComponent(patch[k]); }).join('&');
  return fetch('golden.json' + (q ? '?' + q : '')).then(function (r) { return r.json(); }).then(function (g) {
    window.__PlanPickBoot(g);
    return g;
  });
};
fetch('golden.json').then(function (r) { return r.json(); }).then(function (g) {
  if (typeof window.__PlanPickBoot !== 'function') { window.__fixtureError = 'page.js 未定义 __PlanPickBoot'; return; }
  window.__PlanPickBoot(g);
}).catch(function (e) { window.__fixtureError = 'golden.json 加载失败: ' + e; });
</script>
</body>
</html>
