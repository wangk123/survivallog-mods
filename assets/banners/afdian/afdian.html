<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>爱发电 · 生存日志 MOD · 头像+封面</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#1b1b1f; font-family:"Microsoft YaHei","SimHei","PingFang SC",sans-serif; }
  .board { position:relative; overflow:hidden; margin:48px auto; display:flex; }

  /* ===== 共用视觉（抖音 B 版大数字 999 同款） ===== */
  .green-bg { background: radial-gradient(1050px 760px at 50% 44%, #274631 0%, #16281d 48%, #0c1611 100%); color:#f4f1e8; }
  .green-bg::before { content:""; position:absolute; inset:0;
    background:repeating-linear-gradient(-24deg, rgba(255,255,255,.022) 0 60px, transparent 60px 150px); }
  .num { font-family:"Microsoft YaHei","SimHei",sans-serif; font-weight:900; color:#ffd23f;
    transform:rotate(-3deg); text-shadow:10px 10px 0 #12301d, 20px 20px 0 rgba(0,0,0,.28); }
  .tag { color:#a9c3ae; font-weight:700; }
  .ck { width:1em; height:1em; border:.09em solid #7fd18a; border-radius:50%; color:#7fd18a;
    font-size:.72em; font-weight:900; display:flex; align-items:center; justify-content:center; flex:none; }
  .ribbon { background:#f4f1e8; color:#0f241a; font-weight:900; box-shadow:0 14px 40px rgba(0,0,0,.42); }
  .vdiv { width:0; border-left:2px dashed rgba(244,241,232,.28); align-self:stretch; }

  /* ============ 1 · 头像 800x800（圆形裁切安全） ============ */
  .avatar { width:800px; height:800px; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; }
  .avatar .tag { font-size:34px; letter-spacing:16px; text-indent:16px; }
  .avatar .num { font-size:375px; line-height:1; margin:6px 0 30px; }
  .avatar .ribbon { font-size:62px; padding:12px 46px; letter-spacing:4px; }

  /* ============ 2 · 手机封面 1600x800（显示 800x400） ============ */
  .mobile { width:1600px; height:800px; align-items:center; padding:0 90px; gap:56px; }
  .mobile .left { flex:1; min-width:0; display:flex; flex-direction:column; }
  .mobile .tag { font-size:30px; letter-spacing:14px; }
  .mobile .t1 { margin-top:22px; font-size:118px; font-weight:900; letter-spacing:6px;
    line-height:1.08; text-shadow:0 8px 30px rgba(0,0,0,.5); }
  .mobile .t2 { margin-top:14px; display:flex; align-items:center; gap:22px; }
  .mobile .t2 .mod { font-family:Impact,"Arial Black",sans-serif; font-size:82px; color:#ffd23f; letter-spacing:3px; }
  .mobile .t2 .heji { font-size:76px; font-weight:900; color:#0f241a; background:#ffd23f; padding:0 26px; letter-spacing:8px; }
  .mobile .sub { margin-top:26px; color:#ffd23f; font-size:42px; font-weight:700; letter-spacing:5px; }
  .mobile .checks { margin-top:30px; display:flex; gap:40px; font-size:35px; letter-spacing:2px; }
  .mobile .checks .it { display:flex; align-items:center; gap:14px; }
  .mobile .right { display:flex; flex-direction:column; align-items:center; }
  .mobile .right .num { font-size:400px; line-height:1; }

  /* ============ 3 · 电脑封面 2880x720（显示 1440x360） ============ */
  .pc { width:2880px; height:720px; align-items:center; padding:0 110px; gap:64px; }
  .pc .left { display:flex; flex-direction:column; }
  .pc .tag { font-size:30px; letter-spacing:14px; }
  .pc .t1 { margin-top:20px; display:flex; align-items:baseline; gap:26px; }
  .pc .t1 .cn { font-size:126px; font-weight:900; letter-spacing:6px; text-shadow:0 8px 30px rgba(0,0,0,.5); }
  .pc .t1 .mod { font-family:Impact,"Arial Black",sans-serif; font-size:112px; color:#ffd23f; letter-spacing:3px; }
  .pc .sub { margin-top:24px; color:#ffd23f; font-size:46px; font-weight:700; letter-spacing:5px; }
  .pc .list { flex:1; min-width:0; display:flex; flex-direction:column; gap:24px; font-size:40px; letter-spacing:2px; }
  .pc .list .it { display:flex; align-items:center; gap:18px; white-space:nowrap; }
  .pc .right { display:flex; flex-direction:column; align-items:center; }
  .pc .right .num { font-size:430px; line-height:1; }
</style>
</head>
<body>

<!-- 1 · 头像 -->
<section class="board green-bg avatar" id="avatar">
  <div class="tag">囤 货 党 福 音</div>
  <div class="num">囤</div>
  <div class="ribbon">生存日志 MOD</div>
</section>

<!-- 2 · 手机封面 800x400（2x 渲染） -->
<section class="board green-bg mobile" id="coverMobile">
  <div class="left">
    <div class="tag">囤 货 党 福 音 · 持 续 更 新</div>
    <div class="t1">生存日志</div>
    <div class="t2"><span class="mod">MOD</span><span class="heji">合集</span></div>
    <div class="sub">仓库拉满 · 告别格子焦虑</div>
    <div class="checks">
      <div class="it"><span class="ck">✓</span>格子大扩容</div>
      <div class="it"><span class="ck">✓</span>动作加速</div>
      <div class="it"><span class="ck">✓</span>机器人提速</div>
    </div>
  </div>
  <div class="vdiv"></div>
  <div class="right">
    <div class="num">囤</div>
  </div>
</section>

<!-- 3 · 电脑封面 1440x360（2x 渲染） -->
<section class="board green-bg pc" id="coverPC">
  <div class="left">
    <div class="tag">囤 货 党 福 音</div>
    <div class="t1"><span class="cn">生存日志</span><span class="mod">MOD</span></div>
    <div class="sub">仓库拉满 · 告别格子焦虑</div>
  </div>
  <div class="vdiv"></div>
  <div class="list">
    <div class="it"><span class="ck">✓</span>背包 · 柜子格子大扩容</div>
    <div class="it"><span class="ck">✓</span>搜刮 · 烹饪 · 建造全面加速</div>
    <div class="it"><span class="ck">✓</span>机器人提速 · 干活追平手动</div>
    <div class="it"><span class="ck">✓</span>储藏柜直达 · 普通柜子进容器页签</div>
    <div class="it"><span class="ck">✓</span>全部免费 · 持续更新</div>
  </div>
  <div class="vdiv"></div>
  <div class="right">
    <div class="num">囤</div>
  </div>
</section>

</body>
</html>
