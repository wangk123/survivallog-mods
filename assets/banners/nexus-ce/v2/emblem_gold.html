<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Night 作者徽记 · 夜字印 金系两版</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0c0c0f; color:#e8e6df; font-family:"Microsoft YaHei","SimHei",sans-serif; padding:44px 56px; }
  h1 { font-size:30px; letter-spacing:4px; }
  h1 small { color:#8b8d94; font-size:17px; letter-spacing:2px; margin-left:14px; font-weight:400; }
  .grid { margin-top:36px; display:grid; grid-template-columns:1fr 1fr; gap:28px; }
  .cell { background:#131318; border:1px solid #24242c; border-radius:16px; padding:40px 44px;
    display:flex; gap:40px; align-items:center; }
  .info h2 { font-size:26px; color:#FFC107; letter-spacing:3px; }
  .info .mean { margin-top:12px; color:#c9c9c2; font-size:17px; line-height:1.65; }
  .info .use { margin-top:10px; color:#7f8188; font-size:15px; line-height:1.6; }
  .sizes { margin-top:18px; display:flex; align-items:flex-end; gap:18px; }
  .sizes span { color:#5b5d64; font-size:12px; display:block; text-align:center; margin-top:6px; }
  .lt { margin-top:30px; display:flex; align-items:center; gap:40px; background:#f2ede2; border-radius:16px;
    padding:30px 44px; }
  .lt .t { color:#4a443a; font-size:16px; line-height:1.7; }
  .lt .t b { color:#8a6a1c; }
</style>
</head>
<body>
<h1>夜字印 · 金系两版<small>B 概念落地 · 去红底 · 钤右下角</small></h1>

<div class="grid">

  <!-- 金底暗字 -->
  <div class="cell">
    <div>
      <svg width="264" height="264" viewBox="0 0 264 264">
        <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffe9b0"/><stop offset="1" stop-color="#dfa42c"/>
        </linearGradient></defs>
        <rect x="8" y="8" width="248" height="248" rx="30" fill="url(#g1)"/>
        <rect x="24" y="24" width="216" height="216" rx="20" fill="none" stroke="#f6e8d8" stroke-width="5" opacity=".92"/>
        <text x="132" y="176" text-anchor="middle" font-family="KaiTi,STKaiti,serif" font-weight="900"
              font-size="150" fill="#1d1408">夜</text>
        <text x="132" y="222" text-anchor="middle" font-family="Georgia,serif" font-size="21"
              letter-spacing="6" fill="#1d1408" opacity=".82">NIGHT</text>
      </svg>
    </div>
    <div class="info">
      <h2>B-1 · 金底暗字</h2>
      <div class="mean">印身用品牌金渐变，"夜"与 NIGHT 深棕近黑——对比最强，远看仍是明确的一方印章。</div>
      <div class="use">封面钤印（推荐）／视频角标。深色画面上最跳。</div>
      <div class="sizes">
        <div><svg width="96" height="96" viewBox="0 0 264 264"><rect x="8" y="8" width="248" height="248" rx="30" fill="#FFC107"/><text x="132" y="176" text-anchor="middle" font-family="KaiTi,STKaiti,serif" font-weight="900" font-size="150" fill="#1d1408">夜</text></svg><span>160</span></div>
        <div><svg width="56" height="56" viewBox="0 0 264 264"><rect x="8" y="8" width="248" height="248" rx="30" fill="#FFC107"/><text x="132" y="176" text-anchor="middle" font-family="KaiTi,STKaiti,serif" font-weight="900" font-size="150" fill="#1d1408">夜</text></svg><span>80</span></div>
        <div><svg width="32" height="32" viewBox="0 0 264 264"><rect x="8" y="8" width="248" height="248" rx="30" fill="#FFC107"/><text x="132" y="176" text-anchor="middle" font-family="KaiTi,STKaiti,serif" font-weight="900" font-size="150" fill="#1d1408">夜</text></svg><span>40</span></div>
      </div>
    </div>
  </div>

  <!-- 暗底金字 -->
  <div class="cell">
    <div>
      <svg width="264" height="264" viewBox="0 0 264 264">
        <rect x="8" y="8" width="248" height="248" rx="30" fill="#1b1610"/>
        <rect x="24" y="24" width="216" height="216" rx="20" fill="none" stroke="#FFC107" stroke-width="5"/>
        <text x="132" y="176" text-anchor="middle" font-family="KaiTi,STKaiti,serif" font-weight="900"
              font-size="150" fill="#FFC107">夜</text>
        <text x="132" y="222" text-anchor="middle" font-family="Georgia,serif" font-size="21"
              letter-spacing="6" fill="#FFC107" opacity=".85">NIGHT</text>
      </svg>
    </div>
    <div class="info">
      <h2>B-2 · 暗底金字</h2>
      <div class="mean">乌木印身鎏金字，含蓄高级，像一方老印章；与封面暗棕底同频，存在感更内敛。</div>
      <div class="use">头像（推荐）／浅色页面；封面用则略沉。</div>
      <div class="sizes">
        <div><svg width="96" height="96" viewBox="0 0 264 264"><rect x="8" y="8" width="248" height="248" rx="30" fill="#1b1610"/><text x="132" y="176" text-anchor="middle" font-family="KaiTi,STKaiti,serif" font-weight="900" font-size="150" fill="#FFC107">夜</text></svg><span>160</span></div>
        <div><svg width="56" height="56" viewBox="0 0 264 264"><rect x="8" y="8" width="248" height="248" rx="30" fill="#1b1610"/><text x="132" y="176" text-anchor="middle" font-family="KaiTi,STKaiti,serif" font-weight="900" font-size="150" fill="#FFC107">夜</text></svg><span>80</span></div>
        <div><svg width="32" height="32" viewBox="0 0 264 264"><rect x="8" y="8" width="248" height="248" rx="30" fill="#1b1610"/><text x="132" y="176" text-anchor="middle" font-family="KaiTi,STKaiti,serif" font-weight="900" font-size="150" fill="#FFC107">夜</text></svg><span>40</span></div>
      </div>
    </div>
  </div>
</div>

<!-- 浅底适配性 -->
<div class="lt">
  <svg width="88" height="88" viewBox="0 0 264 264">
    <rect x="8" y="8" width="248" height="248" rx="30" fill="#FFC107"/>
    <text x="132" y="176" text-anchor="middle" font-family="KaiTi,STKaiti,serif" font-weight="900" font-size="150" fill="#1d1408">夜</text>
  </svg>
  <svg width="88" height="88" viewBox="0 0 264 264">
    <rect x="8" y="8" width="248" height="248" rx="30" fill="#1b1610"/>
    <rect x="24" y="24" width="216" height="216" rx="20" fill="none" stroke="#FFC107" stroke-width="5"/>
    <text x="132" y="176" text-anchor="middle" font-family="KaiTi,STKaiti,serif" font-weight="900" font-size="150" fill="#FFC107">夜</text>
  </svg>
  <div class="t">浅底适配验证：B-1 金底在浅色页面依旧成立；B-2 暗底金字靠描边轮廓在浅底也清晰。<br>
    建议：<b>B-1 钤封面右下</b>，<b>B-2 当头像</b>——同一方印的两个材质，体系不散。</div>
</div>
</body>
</html>
