<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>储藏柜直达 · Nexus 标题横幅 1300x372</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#1b1b1f; font-family:"Microsoft YaHei","SimHei","PingFang SC",sans-serif; }

  .board { position:relative; overflow:hidden; width:1300px; height:372px;
    background: radial-gradient(1200px 620px at 42% 40%, #274631 0%, #16281d 48%, #0c1611 100%);
    color:#f4f1e8; display:flex; align-items:center; padding:0 64px 0 72px; gap:40px; }
  .board::before { content:""; position:absolute; inset:0;
    background:repeating-linear-gradient(-24deg, rgba(255,255,255,.022) 0 60px, transparent 60px 150px); }

  .left { position:relative; flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; }
  .tag { color:#a9c3ae; font-weight:700; font-size:21px; letter-spacing:11px; }
  .title { margin-top:12px; display:flex; align-items:baseline; gap:24px; }
  .title .cn { font-size:84px; font-weight:900; letter-spacing:5px; line-height:1;
    text-shadow:0 8px 30px rgba(0,0,0,.5); }
  .title .en { font-family:Impact,"Arial Black",sans-serif; font-size:44px; color:#ffd23f;
    letter-spacing:2px; }
  .sub { margin-top:16px; color:#ffd23f; font-size:31px; font-weight:700; letter-spacing:3px; }
  .checks { margin-top:18px; display:flex; gap:34px; font-size:24px; letter-spacing:1px; }
  .checks .it { display:flex; align-items:center; gap:11px; }
  .ck { width:26px; height:26px; border:2.5px solid #7fd18a; border-radius:50%; color:#7fd18a;
    font-size:17px; font-weight:900; display:flex; align-items:center; justify-content:center; flex:none; }

  .vdiv { width:0; border-left:2px dashed rgba(244,241,232,.28); align-self:stretch; margin:36px 0; }

  .right { position:relative; flex:none; width:300px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; }
  .glyph { font-size:238px; line-height:1; font-weight:900; color:#ffd23f;
    transform:rotate(-3deg); text-shadow:8px 8px 0 #12301d, 16px 16px 0 rgba(0,0,0,.28); }
  .ribbon { margin-top:10px; background:#f4f1e8; color:#0f241a; font-weight:900; font-size:24px;
    padding:7px 26px; letter-spacing:5px; box-shadow:0 10px 28px rgba(0,0,0,.42); }

  .author { position:absolute; right:26px; bottom:16px; color:rgba(244,241,232,.5);
    font-size:16px; letter-spacing:2px; }
</style>
</head>
<body>
<section class="board" id="banner">
  <div class="left">
    <div class="tag">生 存 日 志 · 仓 库 系 列 MOD</div>
    <div class="title"><span class="cn">储藏柜直达</span><span class="en">CabinetEverywhere</span></div>
    <div class="sub">柜子直通制作界面 · 点配方自动取料</div>
    <div class="checks">
      <div class="it"><span class="ck">✓</span>10 个界面</div>
      <div class="it"><span class="ck">✓</span>场景视图</div>
      <div class="it"><span class="ck">✓</span>标签筛选</div>
      <div class="it"><span class="ck">✓</span>不改存档</div>
    </div>
  </div>
  <div class="vdiv"></div>
  <div class="right">
    <div class="glyph">柜</div>
    <div class="ribbon">制 作 取 料 直 达</div>
  </div>
  <div class="author">Night · 抖音 166660371</div>
</section>
</body>
</html>
