<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ModCenter 原型 — 游戏内 Mod 管理菜单</title>
<style>
  :root{
    --bg:#0d0f14; --frame-bg:#14171f; --panel:#171a23; --panel-2:#1d212c;
    --line:#2a2f3d; --line-soft:#22273500;
    --txt:#e8e6e0; --txt-dim:#9aa0ad; --txt-faint:#6b7180;
    --accent:#e8a33d; --accent-soft:#e8a33d22;
    --ok:#4ade80; --warn:#60a5fa; --cold:#f87171; --off:#565d6d;
    --radius:10px;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--txt);
    font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:14px 14px 28px; gap:10px; min-height:100vh;
  }
  /* ===== 演示控制条（原型专用，非游戏内容）===== */
  .demo-bar{
    width:min(96vw,1180px); display:flex; align-items:center; gap:14px;
    color:var(--txt-dim); font-size:13px; flex-wrap:wrap;
  }
  .demo-bar b{color:var(--txt); font-size:14px}
  .demo-bar .seg{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden}
  .demo-bar .seg button{
    background:transparent; color:var(--txt-dim); border:0; padding:5px 14px;
    font-size:13px; cursor:pointer; font-family:inherit;
  }
  .demo-bar .seg button.on{background:var(--accent); color:#1a1408; font-weight:600}
  .demo-bar .tip{margin-left:auto}

  /* ===== 模拟游戏画面 ===== */
  .frame{
    position:relative; width:min(96vw,1180px); aspect-ratio:16/9;
    background:var(--frame-bg); border:1px solid var(--line); border-radius:8px;
    overflow:hidden; user-select:none;
  }
  .frame .scene{position:absolute; inset:0; display:flex; align-items:center; justify-content:center}
  /* 主菜单场景 */
  .scene.menu{background:
    radial-gradient(1200px 700px at 50% 120%, #1c2b3a55, transparent 60%),
    linear-gradient(180deg,#0e131c,#131926 55%,#0e131c)}
  .scene.menu .fake-title{font-size:44px; letter-spacing:14px; font-weight:800; color:#dfe6f2cc; text-shadow:0 4px 24px #0009}
  .scene.menu .fake-list{position:absolute; right:9%; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:14px}
  .scene.menu .fake-list span{
    width:190px; padding:11px 0; text-align:center; font-size:15px; color:#cfd6e4b3;
    border:1px solid #ffffff26; border-radius:6px; background:#ffffff0d;
  }
  .scene.menu .fake-list span:first-child{border-color:#e8a33d66; color:#e8a33d}
  /* 游戏内场景 */
  .scene.game{background:
    radial-gradient(900px 500px at 20% 0%, #2a24165e, transparent 60%),
    linear-gradient(180deg,#171a17,#1c2018 60%,#141712)}
  .scene.game .hud-tl{position:absolute; left:16px; top:14px; display:flex; gap:10px; font-size:15px; color:#e6e0d0aa}
  .scene.game .hud-tl span{background:#00000042; padding:4px 12px; border-radius:14px; border:1px solid #ffffff1a}
  .scene.game .hud-br{position:absolute; right:16px; bottom:14px; display:flex; gap:8px}
  .scene.game .hud-br i{width:44px; height:44px; border-radius:8px; background:#00000052; border:1px solid #ffffff22}
  .scene.game .hud-br i:first-child{border-color:#e8a33d88}
  .scene.game .hud-map{position:absolute; right:16px; top:14px; width:110px; height:78px; border-radius:8px; background:#0f1116cc; border:1px solid #ffffff1f}
  .scene.game .fake-center{color:#cfd3c3aa; font-size:15px; letter-spacing:4px}
  .scene-label{
    position:absolute; left:12px; bottom:10px; font-size:12px; color:#ffffff59;
    background:#00000059; padding:3px 10px; border-radius:10px; z-index:5;
  }

  /* ===== 齿轮入口 ===== */
  .gear{
    position:absolute; left:14px; top:12px; z-index:40;
    width:42px; height:42px; border-radius:50%;
    background:#0f1219d9; border:1px solid #ffffff2e;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:.15s transform,.15s border-color;
    box-shadow:0 3px 14px #0007;
  }
  .gear:hover{transform:rotate(28deg); border-color:var(--accent)}
  .gear svg{width:22px; height:22px; fill:#d8dce6}
  .gear:hover svg{fill:var(--accent)}
  .gear .dot{position:absolute; right:-2px; top:-2px; width:10px; height:10px; border-radius:50%; background:var(--ok); border:2px solid #0f1219}

  /* ===== 管理面板 ===== */
  .overlay{
    position:absolute; inset:0; z-index:50;
    background:#05060acc; backdrop-filter:blur(3px);
    display:none; align-items:center; justify-content:center;
  }
  .overlay.open{display:flex}
  .panel{
    width:92%; height:88%;
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    display:flex; flex-direction:column; overflow:hidden;
    box-shadow:0 18px 70px #000c;
  }
  .panel-head{
    display:flex; align-items:center; gap:12px; padding:13px 18px;
    border-bottom:1px solid var(--line); background:var(--panel-2);
  }
  .panel-head h1{font-size:17px; letter-spacing:2px}
  .panel-head .sub{font-size:12px; color:var(--txt-faint)}
  .panel-head .close{
    margin-left:auto; width:30px; height:30px; border-radius:8px; border:1px solid var(--line);
    background:transparent; color:var(--txt-dim); font-size:15px; cursor:pointer;
  }
  .panel-head .close:hover{border-color:var(--cold); color:var(--cold)}

  .panel-body{flex:1; display:flex; min-height:0}
  /* 左列 */
  .side{
    width:230px; flex-shrink:0; border-right:1px solid var(--line);
    overflow-y:auto; padding:8px;
  }
  .side .cat{font-size:11px; color:var(--txt-faint); letter-spacing:2px; padding:8px 10px 4px}
  .mod-row{
    display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:8px;
    cursor:pointer; border:1px solid transparent;
  }
  .mod-row:hover{background:#ffffff08}
  .mod-row.sel{background:var(--accent-soft); border-color:#e8a33d44}
  .mod-row .st{width:8px; height:8px; border-radius:50%; background:var(--ok); flex-shrink:0}
  .mod-row.off .st{background:var(--off)}
  .mod-row .nm{font-size:13.5px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .mod-row.off .nm{color:var(--txt-faint)}
  .mod-row.lock .nm{color:var(--txt-faint)}
  .mini-sw{
    width:30px; height:17px; border-radius:9px; background:var(--off);
    position:relative; cursor:pointer; flex-shrink:0; transition:.15s;
  }
  .mini-sw::after{
    content:""; position:absolute; left:2px; top:2px; width:13px; height:13px;
    border-radius:50%; background:#cfd3dc; transition:.15s;
  }
  .mini-sw.on{background:var(--ok)}
  .mini-sw.on::after{left:15px}
  .mini-sw.lock{opacity:.35; cursor:not-allowed}

  /* 右区 */
  .cfg{flex:1; overflow-y:auto; padding:16px 22px 30px; min-width:0}
  .cfg .mod-title{display:flex; align-items:center; gap:12px}
  .cfg .mod-title h2{font-size:18px}
  .cfg .mod-title .en{font-size:12px; color:var(--txt-faint); font-weight:400}
  .cfg .mod-desc{margin:8px 0 4px; font-size:13px; color:var(--txt-dim); line-height:1.6}
  .mod-switch{
    display:flex; align-items:center; gap:12px; margin:12px 0 4px; padding:11px 14px;
    border:1px solid var(--line); border-radius:var(--radius); background:var(--panel-2);
  }
  .mod-switch .big-sw{width:46px; height:25px; border-radius:13px; flex-shrink:0}
  .mod-switch .big-sw::after{width:20px; height:20px}
  .mod-switch .big-sw.on::after{left:23px}
  .mod-switch .lbl{font-size:13.5px}
  .mod-switch .hint{font-size:12px; color:var(--txt-faint); margin-top:2px; line-height:1.5}
  .stop-banner{
    margin:10px 0 0; padding:9px 14px; border-radius:8px; font-size:12.5px; line-height:1.6;
    background:#7f1d1d33; border:1px solid #f8717144; color:#fca5a5; display:none;
  }
  .stop-banner.show{display:block}
  .grp{margin-top:20px}
  .grp>h3{
    font-size:12.5px; color:var(--accent); letter-spacing:2px; padding-bottom:7px;
    border-bottom:1px solid var(--line); margin-bottom:4px;
  }
  details.grp summary{cursor:pointer; list-style:none; display:flex; align-items:center; gap:8px}
  details.grp summary::-webkit-details-marker{display:none}
  details.grp summary .arr{font-size:10px; color:var(--txt-faint)}
  .item{
    display:flex; align-items:center; gap:14px; padding:10px 4px;
    border-bottom:1px dashed #ffffff0f;
  }
  .item .info{flex:1; min-width:0}
  .item .info .lb{font-size:13.5px}
  .item .info .ck{font-size:11px; color:var(--txt-faint); font-family:Consolas,monospace; margin-top:2px}
  .item .ctl{width:300px; flex-shrink:0; display:flex; align-items:center; gap:10px; justify-content:flex-end}
  .item .badge{width:96px; flex-shrink:0; text-align:right; font-size:11.5px}
  .b-now{color:var(--ok)} .b-reload{color:var(--warn)} .b-reboot{color:var(--cold)}

  input[type=range]{flex:1; accent-color:var(--accent); height:4px}
  input[type=number]{
    width:62px; background:#0f1219; border:1px solid var(--line); color:var(--txt);
    border-radius:6px; padding:4px 6px; font-size:13px; text-align:center; font-family:inherit;
  }
  input[type=text]{
    width:100%; background:#0f1219; border:1px solid var(--line); color:var(--txt);
    border-radius:6px; padding:5px 9px; font-size:12.5px; font-family:Consolas,monospace;
  }
  input:focus,select:focus{outline:1px solid var(--accent)}
  select{
    background:#0f1219; border:1px solid var(--line); color:var(--txt);
    border-radius:6px; padding:5px 8px; font-size:12.5px; font-family:inherit; max-width:170px;
  }
  .sw{cursor:pointer}

  .panel-foot{
    display:flex; align-items:center; gap:18px; padding:9px 18px;
    border-top:1px solid var(--line); background:var(--panel-2);
    font-size:12px; color:var(--txt-faint);
  }
  .panel-foot .lg{display:flex; gap:14px}

  /* toast */
  .toast{
    position:absolute; right:18px; bottom:16px; z-index:60;
    background:#0f1219f0; border:1px solid var(--ok); color:var(--txt);
    border-radius:10px; padding:10px 16px; font-size:13px;
    display:none; box-shadow:0 8px 30px #000a; line-height:1.5;
  }
  .toast.show{display:block}
  .toast small{color:var(--txt-dim); display:block; font-size:11.5px}

  .side::-webkit-scrollbar,.cfg::-webkit-scrollbar{width:8px}
  .side::-webkit-scrollbar-thumb,.cfg::-webkit-scrollbar-thumb{background:#2a2f3d; border-radius:4px}
</style>
</head>
<body>

<div class="demo-bar">
  <b>ModCenter 原型</b>
  <div class="seg" id="ctxSeg">
    <button data-ctx="menu" class="on">模拟：主菜单（读档前）</button>
    <button data-ctx="game">模拟：游戏内（读档后）</button>
  </div>
  <span>原型仅演示 UI 与交互，不连真实 cfg；左右两个阶段入口为同一齿轮。</span>
  <span class="tip">2026-10-24 · 配套 spec：2026-10-24-modcenter-design.md</span>
</div>

<div class="frame" id="frame">
  <!-- 场景：主菜单 -->
  <div class="scene menu" id="sceneMenu">
    <div class="fake-title">SURVIVAL LOG</div>
    <div class="fake-list">
      <span>继续游戏</span><span>新游戏</span><span>图鉴</span><span>设置</span><span>退出</span>
    </div>
  </div>
  <!-- 场景：游戏内 -->
  <div class="scene game" id="sceneGame" style="display:none">
    <div class="hud-tl"><span>❤ 86</span><span>💚 72</span><span>🛡 3</span></div>
    <div class="hud-map"></div>
    <div class="fake-center">··· 游 戏 画 面 ···</div>
    <div class="hud-br"><i></i><i></i><i></i><i></i><i></i></div>
  </div>
  <div class="scene-label" id="sceneLabel">模拟主菜单 MainUI 页 · 齿轮注入于页面角落</div>

  <!-- 齿轮入口 -->
  <div class="gear" id="gear" title="Mod 管理中心">
    <svg viewBox="0 0 24 24"><path d="M19.14 12.94a7.5 7.5 0 0 0 .06-.94 7.5 7.5 0 0 0-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.3 7.3 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.65 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.5 7.5 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.42.32.61.22l2.39-.96c.49.38 1.03.7 1.62.94l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.19.1.47.02.61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2Z"/></svg>
    <span class="dot"></span>
  </div>

  <!-- 管理面板 -->
  <div class="overlay" id="overlay">
    <div class="panel">
      <div class="panel-head">
        <h1>MOD 管理中心</h1>
        <span class="sub">套件 mod 统一配置 · 改动实时写入 cfg · 无需重启</span>
        <button class="close" id="btnClose">✕ 关闭</button>
      </div>
      <div class="panel-body">
        <div class="side" id="side"></div>
        <div class="cfg" id="cfg"></div>
      </div>
      <div class="panel-foot">
        <span class="lg">
          <span class="b-now">⚡ 立即生效（≤5秒）</span>
          <span class="b-reload">📁 读档后生效</span>
          <span class="b-reboot">🔄 重启后生效</span>
        </span>
        <span style="margin-left:auto">停用 = 立即软停（还原原值）+ 下次启动不再加载</span>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
/* ============ 徽标 ============ */
const BADGE = {
  now:    {t:'⚡ 立即生效', cls:'b-now'},
  reload: {t:'📁 读档后',   cls:'b-reload'},
  reboot: {t:'🔄 重启后',   cls:'b-reboot'},
};

/* ============ 元数据（真实 cfg 清单，spec §7 蓝本） ============ */
const MODS = [
{ id:'backpackexpand', name:'背包扩容', en:'BackpackExpand', enabled:true,
  desc:'背包宽度/高度/负重自由扩容（内存表改写，进程内原值缓存，幂等重算）。',
  groups:[
    {sec:'扩容 Expand', items:[
      {k:'Expand.WidthMult',  l:'背包宽度倍率', t:'float', v:1.5, min:1, max:5, st:0.1, b:'now'},
      {k:'Expand.HeightMult', l:'背包高度倍率', t:'float', v:1.5, min:1, max:5, st:0.1, b:'now'},
      {k:'Expand.BurdenMult', l:'负重倍率',     t:'int',   v:2,   min:1, max:10, st:1, b:'reload'},
      {k:'Expand.ExtraIds',   l:'追加背包ID',   t:'text',  v:'', b:'now', ph:'如 1001,1002'},
      {k:'Expand.ExcludeIds', l:'排除背包ID',   t:'text',  v:'', b:'now', ph:'如 1003'},
    ]},
    {sec:'调试 Debug', debug:true, items:[
      {k:'Debug.Verbose', l:'详细日志', t:'bool', v:false, b:'now'},
    ]},
  ]},
{ id:'cabinetexpand', name:'柜子扩容', en:'CabinetExpand', enabled:true,
  desc:'储藏柜/冰箱/载具三类容器分列扩容 + 超宽柜视口自适应（封顶列数防溢屏）。',
  groups:[
    {sec:'扩容 Expand', items:[
      {k:'Expand.WidthMult',  l:'普通柜 宽度倍率', t:'float', v:1.5, min:1, max:5, st:0.1, b:'now'},
      {k:'Expand.HeightMult', l:'普通柜 高度倍率', t:'float', v:2.0, min:1, max:5, st:0.1, b:'now'},
      {k:'Expand.FridgeWidthMult',  l:'冰箱 宽度倍率', t:'float', v:1.5, min:1, max:5, st:0.1, b:'now'},
      {k:'Expand.FridgeHeightMult', l:'冰箱 高度倍率', t:'float', v:2.0, min:1, max:5, st:0.1, b:'now'},
      {k:'Expand.VehicleWidthMult',  l:'载具 宽度倍率', t:'float', v:1.5, min:1, max:5, st:0.1, b:'now'},
      {k:'Expand.VehicleHeightMult', l:'载具 高度倍率', t:'float', v:2.0, min:1, max:5, st:0.1, b:'now'},
      {k:'Expand.MaxCols', l:'最大列数（封顶）', t:'int', v:20, min:8, max:23, st:1, b:'now'},
      {k:'Expand.ExtraIds',   l:'追加柜ID', t:'text', v:'', b:'now', ph:''},
      {k:'Expand.ExcludeIds', l:'排除柜ID', t:'text', v:'', b:'now', ph:''},
    ]},
    {sec:'视口自适应 UiFit', items:[
      {k:'UiFit.Enabled', l:'启用视口自适应', t:'bool', v:true, b:'now'},
      {k:'UiFit.Mode',    l:'自适应模式', t:'sel', v:'Scroll', opts:['Scroll','Fit','Off'], b:'now'},
    ]},
    {sec:'调试 Debug', debug:true, items:[
      {k:'Debug.Verbose',   l:'详细日志', t:'bool', v:false, b:'now'},
      {k:'Debug.ListOnReady', l:'就绪时列名单', t:'bool', v:true, b:'now'},
      {k:'Debug.DiagOnOpen',  l:'开柜诊断日志', t:'bool', v:false, b:'now'},
    ]},
  ]},
{ id:'fridgechill', name:'保鲜增强', en:'FridgeChill', enabled:true,
  desc:'冰箱/保鲜类容器食材保鲜时长倍率；天赋保鲜上限可调（字节级补丁，进程内常驻但行为可热还原）。',
  groups:[
    {sec:'保鲜 Chill', items:[
      {k:'Chill.KeepMult', l:'保鲜时长倍率', t:'float', v:2, min:1, max:50, st:0.5, b:'now'},
      {k:'Chill.MaxTotalMult', l:'天赋保鲜上限倍率', t:'float', v:100, min:1, max:500, st:1, b:'now',
        note:'启动时字节补丁安装失败则置灰（反射读安装状态）'},
      {k:'Chill.BagIds', l:'生效容器ID', t:'text', v:'', b:'now', ph:'留空=默认名单'},
    ]},
    {sec:'调试 Debug', debug:true, items:[
      {k:'Debug.Verbose', l:'详细日志', t:'bool', v:false, b:'now'},
    ]},
  ]},
{ id:'quickaction', name:'快捷动作', en:'QuickAction', enabled:true,
  desc:'全游戏动作耗时按五分类统一改写（毫秒）；0 = 恢复官方原值。',
  groups:[
    {sec:'分类修改（毫秒，0=恢复原值）', items:[
      {k:'分类修改.物品使用Ms', l:'物品使用', t:'int', v:500, min:0, max:5000, st:50, b:'now'},
      {k:'分类修改.家具功能Ms', l:'家具功能', t:'int', v:500, min:0, max:5000, st:50, b:'now'},
      {k:'分类修改.房屋维护Ms', l:'房屋维护', t:'int', v:500, min:0, max:5000, st:50, b:'now'},
      {k:'分类修改.杂项交互Ms', l:'杂项交互', t:'int', v:500, min:0, max:5000, st:50, b:'now'},
      {k:'分类修改.娱乐锻炼Ms', l:'娱乐锻炼', t:'int', v:500, min:0, max:5000, st:50, b:'now'},
    ]},
    {sec:'其他', items:[
      {k:'其他.Overrides', l:'动作覆盖（ID:毫秒）', t:'text', v:'', b:'now', ph:'如 9075:1000,8012:250'},
    ]},
  ]},
{ id:'cabineteverywhere', name:'柜子直达+筛选', en:'CabinetEverywhere', enabled:true,
  desc:'全容器作为制作/烹饪/酿造等取料源直达；柜子页签标签筛选与场景固定视图。',
  groups:[
    {sec:'直达 Access', items:[
      {k:'Access.EnableCraftSource', l:'制作取料直达', t:'bool', v:true, b:'now'},
      {k:'Access.EnableCooking', l:'烹饪台直达', t:'bool', v:true, b:'now'},

/* ModCenter 自身（列表展示，防呆不可停） */
const SELF = { id:'modcenter', name:'Mod 管理中心', en:'ModCenter（本面板）' };

let cur = 0;

/* ============ 渲染 ============ */
const side = document.getElementById('side');
const cfg  = document.getElementById('cfg');

function renderSide(){
  let h = '<div class="cat">套件 MOD（10）</div>';
  MODS.forEach((m,i)=>{
    h += `<div class="mod-row ${m.enabled?'':'off'} ${i===cur?'sel':''}" data-i="${i}">
      <span class="st"></span><span class="nm">${m.name}</span>
      <span class="mini-sw ${m.enabled?'on':''}" data-act="toggle" data-i="${i}"></span>
    </div>`;
  });
  h += '<div class="cat">面板自身</div>';
  h += `<div class="mod-row lock ${cur===-1?'sel':''}" data-i="-1">
      <span class="st" style="background:var(--accent)"></span><span class="nm">${SELF.name}</span>
      <span class="mini-sw lock" title="防呆：面板不可停用自身"></span>
    </div>`;
  side.innerHTML = h;
}

function ctlHtml(it, gi, ii){
  if(it.t==='bool'){
    return `<span class="mini-sw big-sw ${it.v?'on':''}" data-act="set" data-g="${gi}" data-i="${ii}"></span>`;
  }
  if(it.t==='sel'){
    return `<select data-act="set" data-g="${gi}" data-i="${ii}">${
      it.opts.map(o=>`<option ${o===it.v?'selected':''}>${o}</option>`).join('')
    }</select>`;
  }
  if(it.t==='text'){
    return `<input type="text" value="${it.v}" placeholder="${it.ph||''}" data-act="set" data-g="${gi}" data-i="${ii}">`;
  }
  const step = it.st||0.1;
  return `<input type="range" min="${it.min}" max="${it.max}" step="${step}" value="${it.v}"
      data-act="set" data-g="${gi}" data-i="${ii}">
    <input type="number" min="${it.min}" max="${it.max}" step="${step}" value="${it.v}"
      data-act="set" data-g="${gi}" data-i="${ii}">`;
}

function renderCfg(){
  if(cur===-1){
    cfg.innerHTML = `
      <div class="mod-title"><h2>${SELF.name}</h2><span class="en">${SELF.en}</span></div>
      <div class="mod-desc">管理面板自身插件。提供本界面、配置桥（读写各 mod cfg）与元数据表。<br>
      防呆设计：面板内不可停用自身——停用后你将没有入口恢复，需手编 cfg 文件。</div>
      <div class="mod-switch">
        <span class="mini-sw big-sw on"></span>
        <div><div class="lbl">启用（锁定）</div><div class="hint">开关置灰防呆；如需彻底移除请走安装器卸载组件。</div></div>
      </div>`;
    return;
  }
  const m = MODS[cur];
  let h = `
    <div class="mod-title"><h2>${m.name}</h2><span class="en">${m.en}</span></div>
    <div class="mod-desc">${m.desc}</div>
    <div class="mod-switch">
      <span class="mini-sw big-sw ${m.enabled?'on':''}" data-act="toggle" data-i="${cur}"></span>
      <div>
        <div class="lbl">${m.enabled?'已启用':'已停用'}</div>
        <div class="hint">停用 = 行为立即停止（还原原值）+ 下次启动不再加载；重新启用即恢复全部配置。</div>
      </div>
    </div>
    <div class="stop-banner ${m.enabled?'':'show'}">
      ⛔ 该 mod 当前已停用。此处修改仍会写入 cfg 保存，但需<b>重新启用后</b>才会生效。
    </div>`;
  m.groups.forEach((g,gi)=>{
    const head = `<h3>${g.sec}<span class="arr">▾</span></h3>`;
    const body = g.items.map((it,ii)=>`
      <div class="item">
        <div class="info">
          <div class="lb">${it.l}</div>
          <div class="ck">${it.k}</div>
          ${it.note?`<div class="ck" style="color:#8a90a0">${it.note}</div>`:''}
        </div>
        <div class="ctl">${ctlHtml(it,gi,ii)}</div>
        <div class="badge ${BADGE[it.b].cls}">${BADGE[it.b].t}</div>
      </div>`).join('');
    if(g.debug){
      h += `<details class="grp"${gi===0?' open':''}><summary>${head.replace('</h3>','</h3>')} </summary>${body}</details>`;
      // open by default only if it's the sole group
    }else{
      h += `<div class="grp">${head}${body}</div>`;
    }
  });
  cfg.innerHTML = h;
}

/* ============ 交互 ============ */
function toast(main, badge){
  const t = document.getElementById('toast');
  t.innerHTML = `${main}<small>已写入 cfg · ${
    badge==='now' ? BADGE.now.t+'（约5秒内）' :
    badge==='reload' ? '表值即时改 · '+BADGE.reload.t+'对既有容器体现' :
    BADGE.reboot.t
  }</small>`;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove('show'), 2600);
}

side.addEventListener('click', e=>{
  const sw = e.target.closest('[data-act="toggle"]');
  if(sw){ toggleMod(+sw.dataset.i); return; }
  const row = e.target.closest('.mod-row');
  if(row){
    cur = +row.dataset.i;
    renderSide(); renderCfg();
  }
});

cfg.addEventListener('click', e=>{
  const sw = e.target.closest('[data-act="toggle"]');
  if(sw){ toggleMod(+sw.dataset.i); return; }
  const set = e.target.closest('[data-act="set"]');
  if(set && set.classList.contains('mini-sw')){
    const it = MODS[cur].groups[+set.dataset.g].items[+set.dataset.i];
    it.v = !it.v;
    set.classList.toggle('on', it.v);
    toast(`${MODS[cur].name} · ${it.l} → ${it.v?'开':'关'}`, it.b);
  }
});

cfg.addEventListener('input', e=>{
  const el = e.target;
  if(!el.dataset || el.dataset.act!=='set') return;
  const it = MODS[cur].groups[+el.dataset.g].items[+el.dataset.i];
  if(el.type==='range' || el.type==='number'){
    const v = parseFloat(el.value);
    if(!isNaN(v)){
      it.v = v;
      // 同步同 item 的另一个控件
      cfg.querySelectorAll(`[data-g="${el.dataset.g}"][data-i="${el.dataset.i}"]`).forEach(x=>{
        if(x!==el) x.value = v;
      });
      toast(`${MODS[cur].name} · ${it.l} → ${v}`, it.b);
    }
  }else if(el.tagName==='SELECT'){
    it.v = el.value;
    toast(`${MODS[cur].name} · ${it.l} → ${el.value}`, it.b);
  }
});

cfg.addEventListener('change', e=>{
  if(e.target.type==='text'){
    const el = e.target;
    const it = MODS[cur].groups[+el.dataset.g].items[+el.dataset.i];
    it.v = el.value;
    toast(`${MODS[cur].name} · ${it.l} → ${el.value||'（空）'}`, it.b);
  }
});

function toggleMod(i){
  const m = MODS[i];
  m.enabled = !m.enabled;
  renderSide(); renderCfg();
  toast(m.enabled
    ? `${m.name} 已启用：恢复生效（≤5秒）`
    : `${m.name} 已停用：行为立即还原，下次启动不再加载`, 'now');
}

/* 面板开关 */
const overlay = document.getElementById('overlay');
document.getElementById('gear').addEventListener('click', ()=>overlay.classList.add('open'));
document.getElementById('btnClose').addEventListener('click', ()=>overlay.classList.remove('open'));
overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.classList.remove('open'); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') overlay.classList.remove('open'); });

/* 场景切换 */
document.getElementById('ctxSeg').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#ctxSeg button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  const menu = b.dataset.ctx==='menu';
  document.getElementById('sceneMenu').style.display = menu?'flex':'none';
  document.getElementById('sceneGame').style.display = menu?'none':'flex';
  document.getElementById('sceneLabel').textContent = menu
    ? '模拟主菜单 MainUI 页 · 齿轮注入于页面角落'
    : '模拟游戏内 Root 层 · 齿轮悬浮左上角（不碰页签数组）';
});

renderSide(); renderCfg();
</script>
